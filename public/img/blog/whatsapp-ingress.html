<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Ingress & OCR Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      min-height: 100vh;
      padding: 2rem;
      color: white;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      margin: 0 auto;
    }
    .container { width: 100%; height: 100%; display: flex; flex-direction: column; }
    .header { margin-bottom: 1.5rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.5rem; }
    .pulse-dot { width: 12px; height: 12px; background: #22d3ee; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #94a3b8; font-size: 0.875rem; margin-left: 1.75rem; }
    .diagram-container {
      background: rgba(15, 23, 42, 0.5);
      border-radius: 1rem;
      border: 1px solid #1e293b;
      padding: 1rem;
      flex-grow: 1;
      position: relative;
    }
    svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>Examya Ingress Architecture</h1>
      </div>
      <p class="subtitle">Validación criptográfica en el borde y extracción OCR aislada</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1100 480">
        <defs>
          <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#64748b" />
          </marker>
          <marker id="arrowhead-secure" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#34d399" />
          </marker>
          <marker id="arrowhead-alert" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
            <polygon points="0 0, 10 3.5, 0 7" fill="#fb7185" />
          </marker>
          <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
            <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
          </pattern>
        </defs>

        <rect width="100%" height="100%" fill="url(#grid)" />

        <!-- Boundaries -->
        <rect x="250" y="30" width="820" height="420" rx="12" fill="rgba(34, 211, 238, 0.02)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8,4"/>
        <text x="265" y="55" fill="#22d3ee" font-size="10" font-weight="600">Examya Cloud Infrastructure</text>

        <!-- Components -->
        <!-- User -->
        <rect x="30" y="200" width="100" height="60" rx="6" fill="#0f172a" />
        <rect x="30" y="200" width="100" height="60" rx="6" fill="rgba(30, 41, 59, 0.5)" stroke="#94a3b8" stroke-width="1.5"/>
        <text x="80" y="225" fill="white" font-size="11" font-weight="600" text-anchor="middle">Paciente</text>
        <text x="80" y="242" fill="#94a3b8" font-size="9" text-anchor="middle">Smartphone</text>

        <!-- Meta -->
        <rect x="180" y="200" width="100" height="60" rx="6" fill="#0f172a" />
        <rect x="180" y="200" width="100" height="60" rx="6" fill="rgba(120, 53, 15, 0.3)" stroke="#fbbf24" stroke-width="1.5"/>
        <text x="230" y="225" fill="white" font-size="11" font-weight="600" text-anchor="middle">Meta API</text>
        <text x="230" y="242" fill="#94a3b8" font-size="9" text-anchor="middle">Webhook POST</text>

        <!-- Security Group (Admission Gate) -->
        <rect x="340" y="160" width="160" height="150" rx="8" fill="transparent" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="4,4"/>
        <text x="350" y="175" fill="#fb7185" font-size="9" font-weight="600">DMZ Edge</text>

        <!-- Admission Gate -->
        <rect x="360" y="200" width="120" height="60" rx="6" fill="#0f172a" />
        <rect x="360" y="200" width="120" height="60" rx="6" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1.5"/>
        <text x="420" y="225" fill="white" font-size="11" font-weight="600" text-anchor="middle">Admission Gate</text>
        <text x="420" y="242" fill="#fb7185" font-size="9" text-anchor="middle">SHA-256 Verifier</text>

        <!-- Rejected Drop -->
        <path d="M 420 260 L 420 310" fill="none" stroke="#fb7185" stroke-width="1.5" stroke-dasharray="3,3" marker-end="url(#arrowhead-alert)"/>
        <text x="430" y="290" fill="#fb7185" font-size="9">Drop (401)</text>

        <!-- Internal Services Group -->
        <rect x="540" y="90" width="480" height="340" rx="8" fill="rgba(6, 78, 59, 0.05)" stroke="#34d399" stroke-width="1" stroke-dasharray="4,4"/>
        <text x="550" y="105" fill="#34d399" font-size="9" font-weight="600">Protected Clinical Zone</text>

        <!-- OCR Engine -->
        <rect x="580" y="140" width="120" height="60" rx="6" fill="#0f172a" />
        <rect x="580" y="140" width="120" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="640" y="165" fill="white" font-size="11" font-weight="600" text-anchor="middle">OCR Engine</text>
        <text x="640" y="182" fill="#34d399" font-size="9" text-anchor="middle">Vision Extraction</text>

        <!-- AI Orchestrator -->
        <rect x="760" y="200" width="120" height="60" rx="6" fill="#0f172a" />
        <rect x="760" y="200" width="120" height="60" rx="6" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1.5"/>
        <text x="820" y="225" fill="white" font-size="11" font-weight="600" text-anchor="middle">AI Orchestrator</text>
        <text x="820" y="242" fill="#34d399" font-size="9" text-anchor="middle">State Machine</text>

        <!-- Database -->
        <rect x="760" y="320" width="120" height="60" rx="6" fill="#0f172a" />
        <rect x="760" y="320" width="120" height="60" rx="6" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1.5"/>
        <text x="820" y="345" fill="white" font-size="11" font-weight="600" text-anchor="middle">Clinical DB</text>
        <text x="820" y="362" fill="#a78bfa" font-size="9" text-anchor="middle">PostgreSQL</text>

        <!-- Arrows -->
        <line x1="130" y1="230" x2="178" y2="230" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="155" y="220" fill="#94a3b8" font-size="8" text-anchor="middle">Foto</text>

        <line x1="280" y1="230" x2="358" y2="230" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="320" y="220" fill="#fbbf24" font-size="8" text-anchor="middle">Payload</text>

        <path d="M 480 230 L 520 230 L 520 170 L 578 170" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead-secure)"/>
        <text x="510" y="160" fill="#34d399" font-size="8">Secure URL</text>

        <path d="M 480 230 L 520 230 L 520 230 L 758 230" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead-secure)"/>
        <text x="530" y="220" fill="#34d399" font-size="8">Valid Text</text>

        <path d="M 700 170 L 730 170 L 730 215 L 758 215" fill="none" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrowhead-secure)"/>
        <text x="735" y="195" fill="#34d399" font-size="8">Entities</text>

        <line x1="820" y1="260" x2="820" y2="318" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrowhead)"/>
        <text x="840" y="295" fill="#a78bfa" font-size="8">Save</text>

        <!-- Annotations -->
        <rect x="360" y="100" width="150" height="40" rx="4" fill="rgba(15, 23, 42, 0.8)" stroke="#475569" stroke-width="1"/>
        <text x="435" y="115" fill="white" font-size="8" font-weight="600" text-anchor="middle">1. Firmas Criptográficas</text>
        <text x="435" y="128" fill="#94a3b8" font-size="8" text-anchor="middle">Evita DDoS en Base de Datos</text>
        
        <rect x="620" y="60" width="150" height="40" rx="4" fill="rgba(15, 23, 42, 0.8)" stroke="#475569" stroke-width="1"/>
        <text x="695" y="75" fill="white" font-size="8" font-weight="600" text-anchor="middle">2. Aislamiento de Payload</text>
        <text x="695" y="88" fill="#94a3b8" font-size="8" text-anchor="middle">OCR extrae datos seguros</text>

        <!-- Legend -->
        <text x="40" y="350" fill="white" font-size="10" font-weight="600">Leyenda</text>
        
        <rect x="40" y="365" width="16" height="10" rx="2" fill="rgba(136, 19, 55, 0.4)" stroke="#fb7185" stroke-width="1"/>
        <text x="65" y="373" fill="#94a3b8" font-size="8">DMZ / Security</text>
        
        <rect x="40" y="380" width="16" height="10" rx="2" fill="rgba(6, 78, 59, 0.4)" stroke="#34d399" stroke-width="1"/>
        <text x="65" y="388" fill="#94a3b8" font-size="8">Internal Backend</text>
        
        <rect x="40" y="395" width="16" height="10" rx="2" fill="rgba(76, 29, 149, 0.4)" stroke="#a78bfa" stroke-width="1"/>
        <text x="65" y="403" fill="#94a3b8" font-size="8">Storage Layer</text>

      </svg>
    </div>
  </div>
</body>
</html>

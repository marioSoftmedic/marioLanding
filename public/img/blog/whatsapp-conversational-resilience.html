<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Conversational Resilience Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      min-height: 100vh;
      padding: 2rem;
      color: white;
      width: 1200px;
      height: 630px;
      overflow: hidden;
      margin: 0 auto;
    }
    .container { width: 100%; height: 100%; display: flex; flex-direction: column; }
    .header { margin-bottom: 1.25rem; }
    .header-row { display: flex; align-items: center; gap: 1rem; margin-bottom: 0.35rem; }
    .pulse-dot { width: 12px; height: 12px; background: #06b6d4; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #94a3b8; font-size: 0.85rem; margin-left: 1.75rem; }
    .diagram-container {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 1rem;
      border: 1px solid #1e293b;
      padding: 1rem;
      flex-grow: 1;
      position: relative;
    }
    svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>Examya • Shuri Conversational Resilience</h1>
      </div>
      <p class="subtitle">Sub-intents educativos no destructivos y Circuit Breaker de OCR con Handoff humano</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1100 470">
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
          </marker>
          <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#06b6d4" />
          </marker>
          <marker id="arrow-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
          </marker>
          <marker id="arrow-rose" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#f43f5e" />
          </marker>
        </defs>

        <!-- COLUMNA 1: PACIENTE & MENSAJE -->
        <g transform="translate(30, 160)">
          <rect width="180" height="120" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
          <text x="90" y="35" fill="#f8fafc" font-size="14" font-weight="700" text-anchor="middle">Paciente WhatsApp</text>
          <text x="90" y="65" fill="#94a3b8" font-size="11" text-anchor="middle">Mensaje Inbound</text>
          <text x="90" y="85" fill="#06b6d4" font-size="10" text-anchor="middle">Texto / Foto Receta</text>
        </g>

        <!-- FLECHA 1 -> ROUTER -->
        <line x1="210" y1="220" x2="270" y2="220" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

        <!-- COLUMNA 2: INTENT ROUTER -->
        <g transform="translate(280, 120)">
          <rect width="220" height="200" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
          <text x="110" y="30" fill="#38bdf8" font-size="14" font-weight="700" text-anchor="middle">Shuri Intent Router</text>
          <text x="110" y="55" fill="#94a3b8" font-size="11" text-anchor="middle">FSM State Evaluator</text>
          
          <rect x="20" y="75" width="180" height="40" rx="4" fill="#0f172a" stroke="#334155" />
          <text x="110" y="100" fill="#e2e8f0" font-size="11" text-anchor="middle">Stage: QUOTING / CART</text>

          <rect x="20" y="130" width="180" height="45" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-dasharray="3,3" />
          <text x="110" y="150" fill="#38bdf8" font-size="10" text-anchor="middle">Intent Branching</text>
          <text x="110" y="165" fill="#94a3b8" font-size="9" text-anchor="middle">Preserve State = true</text>
        </g>

        <!-- BIFURCACION 1: SUB-INTENT EDUCATIVO (ARRIBA) -->
        <path d="M 500 180 L 570 180 L 570 80 L 610 80" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)" />

        <!-- CAJA EDUCATIVA -->
        <g transform="translate(620, 20)">
          <rect width="250" height="120" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1.5" />
          <text x="125" y="28" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">Sub-Intent: exam_inquiry</text>
          <text x="125" y="52" fill="#cbd5e1" font-size="10" text-anchor="middle">• Consulta Fonasa / Ayuno</text>
          <text x="125" y="70" fill="#cbd5e1" font-size="10" text-anchor="middle">• Explicación Pedagógica</text>
          <text x="125" y="95" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">✔ Estado Transaccional Intacto</text>
        </g>

        <!-- RETORNO EDUCATIVO AL CHECKOUT -->
        <path d="M 870 80 L 920 80 L 920 180 L 940 180" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" />

        <!-- BIFURCACION 2: FLUJO TRANSACCIONAL CONTINUO (CENTRO) -->
        <line x1="500" y1="220" x2="940" y2="220" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-emerald)" />

        <!-- BIFURCACION 3: OCR CIRCUIT BREAKER (ABAJO) -->
        <path d="M 500 260 L 570 260 L 570 360 L 610 360" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-rose)" />

        <!-- CAJA OCR CIRCUIT BREAKER -->
        <g transform="translate(620, 300)">
          <rect width="250" height="130" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5" />
          <text x="125" y="28" fill="#fda4af" font-size="13" font-weight="700" text-anchor="middle">OCR Circuit Breaker</text>
          <text x="125" y="52" fill="#fecdd3" font-size="10" text-anchor="middle">Retry Count >= 2 (Fallo de foto)</text>
          
          <line x1="20" y1="65" x2="230" y2="65" stroke="#881337" stroke-width="1" />
          
          <text x="125" y="85" fill="#38bdf8" font-size="10" text-anchor="middle">Branch A: Búsqueda Manual</text>
          <text x="125" y="105" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">Branch B: Slack Alert Handoff</text>
        </g>

        <!-- RETORNO DE OCR / HANDOFF A ASESOR O CHECKOUT -->
        <path d="M 870 360 L 920 360 L 920 260 L 940 260" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-rose)" />

        <!-- COLUMNA 4: OUTCOME / CHECKOUT -->
        <g transform="translate(950, 160)">
          <rect width="130" height="120" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
          <text x="65" y="35" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">Checkout</text>
          <text x="65" y="55" fill="#a7f3d0" font-size="12" font-weight="700" text-anchor="middle">Resiliente</text>
          <text x="65" y="85" fill="#ffffff" font-size="10" text-anchor="middle">Link de Pago</text>
          <text x="65" y="100" fill="#a7f3d0" font-size="9" text-anchor="middle">Orden Médica MOS</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>

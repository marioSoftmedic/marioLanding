<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Conversational Resilience Architecture</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      color: white;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
    }
    /* Scrollbar personalizada y elegante */
    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #06b6d4;
    }
    .wrapper {
      min-width: 1120px;
      width: 1120px;
      height: 540px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
    }
    .header { margin-bottom: 1rem; }
    .header-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem; }
    .pulse-dot { width: 10px; height: 10px; background: #06b6d4; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #94a3b8; font-size: 0.82rem; margin-left: 1.5rem; }
    .diagram-container {
      background: rgba(15, 23, 42, 0.7);
      border-radius: 0.75rem;
      border: 1px solid #1e293b;
      padding: 0.75rem;
      flex-grow: 1;
      position: relative;
    }
    svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>Examya • Shuri Conversational Resilience</h1>
      </div>
      <p class="subtitle">Sub-intents educativos no destructivos y Circuit Breaker de OCR con Handoff humano</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1080 430">
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
          </marker>
          <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#06b6d4" />
          </marker>
          <marker id="arrow-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
          </marker>
          <marker id="arrow-rose" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#f43f5e" />
          </marker>
        </defs>

        <!-- COLUMNA 1: PACIENTE & MENSAJE -->
        <g transform="translate(20, 150)">
          <rect width="170" height="110" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
          <text x="85" y="32" fill="#f8fafc" font-size="13" font-weight="700" text-anchor="middle">Paciente WhatsApp</text>
          <text x="85" y="60" fill="#94a3b8" font-size="11" text-anchor="middle">Mensaje Inbound</text>
          <text x="85" y="80" fill="#06b6d4" font-size="10" text-anchor="middle">Texto / Foto Receta</text>
        </g>

        <!-- FLECHA 1 -> ROUTER -->
        <line x1="190" y1="205" x2="250" y2="205" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)" />

        <!-- COLUMNA 2: INTENT ROUTER -->
        <g transform="translate(260, 110)">
          <rect width="210" height="190" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="2" />
          <text x="105" y="28" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">Shuri Intent Router</text>
          <text x="105" y="50" fill="#94a3b8" font-size="10" text-anchor="middle">FSM State Evaluator</text>
          
          <rect x="15" y="68" width="180" height="38" rx="4" fill="#0f172a" stroke="#334155" />
          <text x="105" y="92" fill="#e2e8f0" font-size="10" text-anchor="middle">Stage: QUOTING / CART</text>

          <rect x="15" y="118" width="180" height="42" rx="4" fill="#0f172a" stroke="#06b6d4" stroke-dasharray="3,3" />
          <text x="105" y="137" fill="#38bdf8" font-size="10" text-anchor="middle">Intent Branching</text>
          <text x="105" y="152" fill="#94a3b8" font-size="9" text-anchor="middle">Preserve State = true</text>
        </g>

        <!-- BIFURCACION 1: SUB-INTENT EDUCATIVO (ARRIBA) -->
        <path d="M 470 165 L 530 165 L 530 75 L 570 75" fill="none" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)" />

        <!-- CAJA EDUCATIVA -->
        <g transform="translate(580, 15)">
          <rect width="240" height="115" rx="8" fill="#083344" stroke="#06b6d4" stroke-width="1.5" />
          <text x="120" y="26" fill="#38bdf8" font-size="12" font-weight="700" text-anchor="middle">Sub-Intent: exam_inquiry</text>
          <text x="120" y="48" fill="#cbd5e1" font-size="10" text-anchor="middle">• Consulta Fonasa / Ayuno</text>
          <text x="120" y="66" fill="#cbd5e1" font-size="10" text-anchor="middle">• Explicación Pedagógica</text>
          <text x="120" y="92" fill="#10b981" font-size="10" font-weight="600" text-anchor="middle">✔ Estado Transaccional Intacto</text>
        </g>

        <!-- RETORNO EDUCATIVO AL CHECKOUT -->
        <path d="M 820 75 L 870 75 L 870 170 L 910 170" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" />

        <!-- BIFURCACION 2: FLUJO TRANSACCIONAL CONTINUO (CENTRO) -->
        <line x1="470" y1="205" x2="910" y2="205" stroke="#10b981" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-emerald)" />

        <!-- BIFURCACION 3: OCR CIRCUIT BREAKER (ABAJO) -->
        <path d="M 470 245 L 530 245 L 530 335 L 570 335" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-rose)" />

        <!-- CAJA OCR CIRCUIT BREAKER -->
        <g transform="translate(580, 275)">
          <rect width="240" height="120" rx="8" fill="#4c0519" stroke="#f43f5e" stroke-width="1.5" />
          <text x="120" y="26" fill="#fda4af" font-size="12" font-weight="700" text-anchor="middle">OCR Circuit Breaker</text>
          <text x="120" y="48" fill="#fecdd3" font-size="10" text-anchor="middle">Retry Count >= 2 (Fallo de foto)</text>
          
          <line x1="15" y1="60" x2="225" y2="60" stroke="#881337" stroke-width="1" />
          
          <text x="120" y="78" fill="#38bdf8" font-size="10" text-anchor="middle">Branch A: Búsqueda Manual</text>
          <text x="120" y="98" fill="#fb7185" font-size="10" font-weight="600" text-anchor="middle">Branch B: Slack Alert Handoff</text>
        </g>

        <!-- RETORNO DE OCR / HANDOFF A ASESOR O CHECKOUT -->
        <path d="M 820 335 L 870 335 L 870 240 L 910 240" fill="none" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrow-rose)" />

        <!-- COLUMNA 4: OUTCOME / CHECKOUT -->
        <g transform="translate(920, 150)">
          <rect width="130" height="110" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
          <text x="65" y="32" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">Checkout</text>
          <text x="65" y="50" fill="#a7f3d0" font-size="12" font-weight="700" text-anchor="middle">Resiliente</text>
          <text x="65" y="76" fill="#ffffff" font-size="10" text-anchor="middle">Link de Pago</text>
          <text x="65" y="90" fill="#a7f3d0" font-size="9" text-anchor="middle">Orden Médica MOS</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WhatsApp Bot Database Connection Pool Architecture (EMAXCONN Mitigation)</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      color: white;
      height: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      -webkit-overflow-scrolling: touch;
    }
    ::-webkit-scrollbar {
      height: 8px;
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #0f172a;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb {
      background: #334155;
      border-radius: 4px;
      border: 1px solid #1e293b;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #06b6d4;
    }
    .wrapper {
      min-width: 1120px;
      width: 1120px;
      height: 540px;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
    }
    .header { margin-bottom: 1rem; }
    .header-row { display: flex; align-items: center; gap: 0.75rem; margin-bottom: 0.25rem; }
    .pulse-dot { width: 10px; height: 10px; background: #10b981; border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
    h1 { font-size: 1.3rem; font-weight: 700; letter-spacing: -0.025em; }
    .subtitle { color: #94a3b8; font-size: 0.82rem; margin-left: 1.5rem; }
    .diagram-container {
      background: rgba(15, 23, 42, 0.7);
      border-radius: 0.75rem;
      border: 1px solid #1e293b;
      padding: 0.75rem;
      flex-grow: 1;
      position: relative;
    }
    svg { width: 100%; height: 100%; display: block; }
  </style>
</head>
<body>
  <div class="wrapper">
    <div class="header">
      <div class="header-row">
        <div class="pulse-dot"></div>
        <h1>Examya • Database Persistence & Transaction Pooling</h1>
      </div>
      <p class="subtitle">Mitigación de EMAXCONN: PgBouncer en modo transacción (6543), connection_limit acotado y aislamiento de DIRECT_URL</p>
    </div>

    <div class="diagram-container">
      <svg viewBox="0 0 1080 430">
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
          </marker>
          <marker id="arrow-cyan" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#06b6d4" />
          </marker>
          <marker id="arrow-emerald" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#10b981" />
          </marker>
          <marker id="arrow-rose" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#f43f5e" />
          </marker>
          <marker id="arrow-amber" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#f59e0b" />
          </marker>
        </defs>

        <!-- COLUMNA 1: WHATSAPP WEBHOOK TRAFFIC BURST -->
        <g transform="translate(15, 120)">
          <rect width="180" height="180" rx="8" fill="#0f172a" stroke="#06b6d4" stroke-width="1.5" />
          <text x="90" y="28" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">WhatsApp Ingress</text>
          <text x="90" y="48" fill="#94a3b8" font-size="10" text-anchor="middle">Ráfagas Concurrentes</text>
          
          <rect x="15" y="65" width="150" height="28" rx="4" fill="#1e293b" stroke="#334155" />
          <text x="90" y="83" fill="#f8fafc" font-size="9" text-anchor="middle">1. Saludo / Texto</text>
          
          <rect x="15" y="98" width="150" height="28" rx="4" fill="#1e293b" stroke="#334155" />
          <text x="90" y="116" fill="#f8fafc" font-size="9" text-anchor="middle">2. Foto Orden OCR</text>
          
          <rect x="15" y="131" width="150" height="28" rx="4" fill="#1e293b" stroke="#334155" />
          <text x="90" y="149" fill="#f8fafc" font-size="9" text-anchor="middle">3. Cotización / Duda</text>
        </g>

        <!-- FLECHA 1 -> APP RUNTIMES -->
        <line x1="195" y1="210" x2="245" y2="210" stroke="#06b6d4" stroke-width="2" marker-end="url(#arrow-cyan)" />

        <!-- COLUMNA 2: APLICACIONES & SINGLETON PRISMA CLIENTS -->
        <g transform="translate(255, 60)">
          <rect width="240" height="300" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
          <text x="120" y="28" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">Node.js / NestJS Runtime</text>
          <text x="120" y="48" fill="#94a3b8" font-size="10" text-anchor="middle">examya-api + examya-agents</text>
          
          <!-- Singleton Container -->
          <rect x="15" y="65" width="210" height="105" rx="6" fill="#0f172a" stroke="#06b6d4" stroke-dasharray="3,3" />
          <text x="120" y="85" fill="#67e8f9" font-size="11" font-weight="600" text-anchor="middle">Singleton Prisma Client</text>
          <text x="120" y="105" fill="#cbd5e1" font-size="9" text-anchor="middle">• globalThis.prisma instance</text>
          <text x="120" y="122" fill="#cbd5e1" font-size="9" text-anchor="middle">• connection_limit = 3 a 5</text>
          <text x="120" y="139" fill="#cbd5e1" font-size="9" text-anchor="middle">• pool_timeout = 10s (Fail-Fast)</text>
          <text x="120" y="156" fill="#10b981" font-size="9" font-weight="700" text-anchor="middle">✔ Cero instancias duplicadas</text>

          <!-- CI/CD Migrations Container -->
          <rect x="15" y="185" width="210" height="95" rx="6" fill="#0f172a" stroke="#f59e0b" stroke-width="1" />
          <text x="120" y="205" fill="#fcd34d" font-size="10" font-weight="700" text-anchor="middle">CI/CD Deploy Pipeline</text>
          <text x="120" y="225" fill="#94a3b8" font-size="9" text-anchor="middle">prisma migrate deploy</text>
          <text x="120" y="245" fill="#fcd34d" font-size="9" text-anchor="middle">DIRECT_URL (Puerto 5432)</text>
          <text x="120" y="263" fill="#cbd5e1" font-size="8" text-anchor="middle">Aislado de tráfico de usuarios</text>
        </g>

        <!-- FLECHA RUNTIME -> TRANSACTION POOLER -->
        <path d="M 495 120 L 555 120" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" />

        <!-- FLECHA CI/CD -> DIRECT POSTGRES -->
        <path d="M 495 240 L 800 240 L 800 280 L 835 280" fill="none" stroke="#f59e0b" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrow-amber)" />

        <!-- COLUMNA 3: TRANSACTION POOLER (PGBOUNCER / SUPAVISOR) -->
        <g transform="translate(565, 50)">
          <rect width="230" height="150" rx="8" fill="#064e3b" stroke="#10b981" stroke-width="2" />
          <text x="115" y="26" fill="#6ee7b7" font-size="12" font-weight="700" text-anchor="middle">Transaction Pooler</text>
          <text x="115" y="44" fill="#a7f3d0" font-size="10" text-anchor="middle">PgBouncer (Puerto 6543)</text>
          
          <line x1="15" y1="55" x2="215" y2="55" stroke="#047857" stroke-width="1" />
          
          <text x="115" y="75" fill="#ffffff" font-size="9" text-anchor="middle">• pgbouncer=true</text>
          <text x="115" y="93" fill="#ffffff" font-size="9" text-anchor="middle">• Conexión liberada por query</text>
          <text x="115" y="111" fill="#a7f3d0" font-size="9" text-anchor="middle">• Multiplexación 200:1</text>
          <text x="115" y="132" fill="#6ee7b7" font-size="9" font-weight="700" text-anchor="middle">✔ Elimina EMAXCONN</text>
        </g>

        <!-- FLECHA POOLER -> POSTGRES CORE -->
        <path d="M 795 125 L 835 125" fill="none" stroke="#10b981" stroke-width="2" marker-end="url(#arrow-emerald)" />

        <!-- COLUMNA 4: POSTGRESQL CORE DB -->
        <g transform="translate(845, 70)">
          <rect width="215" height="260" rx="8" fill="#0f172a" stroke="#10b981" stroke-width="2" />
          <text x="107" y="28" fill="#38bdf8" font-size="13" font-weight="700" text-anchor="middle">PostgreSQL Core DB</text>
          <text x="107" y="48" fill="#94a3b8" font-size="10" text-anchor="middle">Supabase / AWS RDS</text>
          
          <rect x="15" y="65" width="185" height="40" rx="4" fill="#1e293b" stroke="#10b981" />
          <text x="107" y="82" fill="#6ee7b7" font-size="10" font-weight="700" text-anchor="middle">15-25 Conexiones Activas</text>
          <text x="107" y="96" fill="#a7f3d0" font-size="8" text-anchor="middle">Estabilidad bajo ráfagas</text>

          <rect x="15" y="115" width="185" height="40" rx="4" fill="#1e293b" stroke="#334155" />
          <text x="107" y="132" fill="#38bdf8" font-size="10" font-weight="600" text-anchor="middle">>70% Headroom Libre</text>
          <text x="107" y="146" fill="#94a3b8" font-size="8" text-anchor="middle">Capacidad para escalar</text>

          <rect x="15" y="165" width="185" height="75" rx="4" fill="#082f49" stroke="#0284c7" />
          <text x="107" y="185" fill="#38bdf8" font-size="10" font-weight="700" text-anchor="middle">Direct Admin Channel</text>
          <text x="107" y="202" fill="#e0f2fe" font-size="9" text-anchor="middle">Puerto 5432 (Reservado)</text>
          <text x="107" y="218" fill="#94a3b8" font-size="8" text-anchor="middle">Solo DDL / Superuser</text>
        </g>
      </svg>
    </div>
  </div>
</body>
</html>
